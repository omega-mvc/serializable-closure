name: Coding Standard

on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read


jobs:
  coding-standard:
    name: PHP_CodeSniffer (PSR-12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php-8.4-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php-8.4-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create PHPCS cache directory
        # phpcs cannot create intermediate directory for its result cache
        run: mkdir -p cache/phpcs

      - name: Run PHP_CodeSniffer
        run: vendor/bin/phpcs
