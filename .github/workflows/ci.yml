name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHPUnit
    uses: ./.github/workflows/tests.yml

  coding-standard:
    name: PHPCS
    uses: ./.github/workflows/coding-standard.yml

  static-analysis:
    name: PHPStan
    uses: ./.github/workflows/static-analysis.yml
